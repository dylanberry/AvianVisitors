; Bird Up! - raise PHP upload limits for the OTA server endpoint.
; php-fpm applies .user.ini files found in the script's directory
; (user_ini.filename defaults to ".user.ini"). The node firmware image
; (~1.5 MB today, app partition allows 6.25 MB) exceeds Debian's default
; upload_max_filesize of 2M.
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 4
